product:
  name: Starter
  archivedAt: null
  isActive: true
  settings:
    cancelUrl: null
    successUrl: null
    allowPromoCodes: false
    automaticTax: false
    collectBillingAddress: false
    collectShippingAddress: false
    cardPrefillPreference: none
    pastDueEntitlements: true
entitlements:
  - name: export_hd
plans:
  - name: Starter
    isActive: true
    isPerpetual: false
    trialPeriodDays: null
    entitlements:
      - export_hd
    lineItems:
      - name: Starter
        slug: starter
        nickname: ''
        priceType: token
        intervalType: recurring
        billingScheme: per_unit
        isActive: true
        isUnlimited: true
        maxQuantity: null
        allowChangingQuantity: false
        tiersMode: null
        minQuantity: 1
        meterSlug: null
        unitLabel: null
        tokenSlug: image_tokens
        tokenQuantity: 1000
        tokenResetBehaviour: reset
        tokenExpiryDays: null
        prices:
          - defaultCurrency: USD
            interval: month
            intervalCount: 1
            currencyOptions:
              - currency: USD
                unitAmount: 2900
                tiers: []
            archivedAt: null
        archivedAt: null
    archivedAt: null
  - name: Token Top-Up
    isActive: true
    # Mirrors ticking "Create a perpetual subscription" in the dashboard. The
    # guide treats this as optional: a top-up purchase always produces a receipt
    # and a token record, and the tokens can be spent while Starter is valid.
    # The perpetual subscription is only needed so top-up buyers keep access
    # to image_tokens without (or after) a Starter subscription.
    isPerpetual: true
    trialPeriodDays: null
    # export_hd is deliberately left off so only Starter unlocks Export HD. Add
    # it here if top-up buyers should receive it too.
    entitlements: []
    lineItems:
      # One-off token line items always accumulate and the token record never
      # expires, which is why tokenResetBehaviour and tokenExpiryDays are null.
      - name: Token Top-Up
        slug: token_topup
        nickname: ''
        priceType: token
        intervalType: one_off
        billingScheme: per_unit
        isActive: true
        isUnlimited: true
        maxQuantity: null
        allowChangingQuantity: false
        tiersMode: null
        minQuantity: 1
        meterSlug: null
        unitLabel: null
        tokenSlug: image_tokens
        tokenQuantity: 1000
        tokenResetBehaviour: null
        tokenExpiryDays: null
        prices:
          - defaultCurrency: USD
            interval: null
            intervalCount: null
            currencyOptions:
              - currency: USD
                unitAmount: 2900
                tiers: []
            archivedAt: null
        archivedAt: null
    archivedAt: null
